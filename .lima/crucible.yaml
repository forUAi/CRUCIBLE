# Lima VM for CRUCIBLE: the Linux substrate the sandbox requires.
# Apple Virtualization.framework (vz) -> native arm64, no QEMU emulation.
vmType: "vz"
os: "Linux"
arch: "aarch64"

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

cpus: 4
memory: "6GiB"
disk: "40GiB"

mountType: "virtiofs"
mounts:
# READ-ONLY on purpose. This mount exists so the developer can get CRUCIBLE's
# own source into the guest; it is not where repositories are executed. A
# writable virtiofs share is a hole straight back to the host filesystem, and
# a sandbox whose own source tree is writable from inside the sandbox is not
# a sandbox. Clone from here to guest-local storage before running anything.
#
# crucible/containment.py enforces the same rule in code: a repository whose
# path resolves onto virtiofs/9p/sshfs/NFS is copied to guest-local storage
# before it becomes the workspace lower layer, so this config is defence in
# depth rather than the only control.
- location: "~/Projects/crucible"
  writable: false

# CRUCIBLE needs: overlayfs, mount/pid/net/uts/ipc namespaces, cgroup v2,
# losetup + mkfs.ext4 for the private layer store, util-linux nsenter/unshare.
provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux
    export DEBIAN_FRONTEND=noninteractive
    apt-get update -qq
    # `quota` is a declared dependency, not an optional extra: per-sandbox
    # disk budgets are enforced with ext4 project quotas, and without
    # setquota a repository can fill the store and wedge every other job.
    apt-get install -y -qq python3 python3-venv util-linux e2fsprogs mount \
                          ca-certificates curl git iproute2 procps rsync \
                          quota >/dev/null
    modprobe overlay || true
    echo "cgroup version:"; stat -fc %T /sys/fs/cgroup
